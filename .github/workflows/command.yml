name: Channel Command Handler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for channel-name messages and reply
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./command.ps1

      - name: Save updated offset
        run: |
          git config user.name "youtube-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram_offset.json
          git diff --cached --quiet || git commit -m "Update telegram offset [skip ci]"
          git push
