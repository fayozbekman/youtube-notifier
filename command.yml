name: Channel Command Handler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for channel-name messages and reply
        shell: pwsh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./command.ps1

      - name: Save updated offset
        run: |
          git config user.name "youtube-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add telegram_offset.json
          if git diff --cached --quiet; then
            echo "No offset changes to commit."
            exit 0
          fi
          git commit -m "Update telegram offset [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (concurrent run likely updated the branch), retrying after rebase (attempt $i)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries."
          exit 1
